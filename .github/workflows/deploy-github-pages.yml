name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meme/package-lock.json

      - name: Install dependencies
        working-directory: meme
        run: npm ci

      - name: Build
        working-directory: meme
        env:
          REACT_APP_API_ID: ${{ secrets.REACT_APP_API_ID }}
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
        run: npm run build

      - name: Add SPA fallback for client-side routing
        working-directory: meme
        run: cp build/index.html build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: meme/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
